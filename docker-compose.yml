version: '3.8'

services:
  # Production API service
  api:
    build:
      context: .
      target: production
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Streamlit dashboard
  dashboard:
    build:
      context: .
      target: production
    ports:
      - "8501:8501"
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
      - ./reports:/app/reports:ro
    command: ["streamlit", "run", "scripts/dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      - api
    restart: unless-stopped

  # MLflow tracking server
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.8.0
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:///mlflow.db
      - MLFLOW_ARTIFACT_STORE_URI=./mlruns
    volumes:
      - ./mlruns:/mlflow/mlruns
      - ./mlflow.db:/mlflow/mlflow.db
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000"]
    restart: unless-stopped

  # Development environment
  dev:
    build:
      context: .
      target: development
    ports:
      - "8888:8888"  # Jupyter
      - "8001:8000"  # API (dev port)
      - "8502:8501"  # Dashboard (dev port)
    environment:
      - PYTHONPATH=/app
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - .:/app
      - ./models:/app/models
      - ./data:/app/data
      - ./reports:/app/reports
    profiles:
      - dev

  # PostgreSQL for MLflow (optional)
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=mlflow
      - POSTGRES_USER=mlflow
      - POSTGRES_PASSWORD=mlflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    profiles:
      - postgres

volumes:
  postgres_data:

networks:
  default:
    driver: bridge